[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net",
    "crates/raknet",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
anyhow = "1"
tracing = "0.1"

# Optimized for Raspberry Pi Zero 2 W (512 MB RAM) & WASM size
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
