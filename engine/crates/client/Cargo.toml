[package]
name = "revival-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["luau"]
luau = ["revival-core/luau"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
revival-core = { path = "../core", default-features = false }
revival-net = { path = "../net" }
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["native-certs"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Performance"] }
wgpu = { version = "24", features = ["webgl"] }
