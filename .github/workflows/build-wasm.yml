name: Build WebAssembly PWA (wasm32)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build revival-client.wasm (wasm32-unknown-unknown)
        working-directory: engine
        run: |
          cargo build --release --target wasm32-unknown-unknown -p revival-client --no-default-features --lib
          wasm-bindgen --target web --out-dir ../launchers/web-pwa/pkg target/wasm32-unknown-unknown/release/revival_client.wasm
          ls -lh ../launchers/web-pwa/pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: revival-web-pwa-wasm
          path: launchers/web-pwa/
