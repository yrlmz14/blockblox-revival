name: Build Android APK (arm64-v8a)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build librevival_client.so (arm64-v8a)
        working-directory: engine
        run: |
          cargo ndk -t arm64-v8a -o ../launchers/android-libreblox/app/src/main/jniLibs build --release -p revival-client
          LIBCPP=$(find "$ANDROID_NDK_HOME" -name "libc++_shared.so" -path "*aarch64-linux-android*" | head -n 1)
          if [ -n "$LIBCPP" ]; then cp -f "$LIBCPP" ../launchers/android-libreblox/app/src/main/jniLibs/arm64-v8a/; fi
          ls -lh ../launchers/android-libreblox/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: launchers/android-libreblox
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: revival-libreblox-arm64-debug-apk
          path: launchers/android-libreblox/app/build/outputs/apk/debug/*.apk
