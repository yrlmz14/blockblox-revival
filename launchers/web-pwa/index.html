<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>BlockBlox Revival (WebAssembly / iOS PWA)</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .card { width: min(960px, 100%); background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 18px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 1.2rem; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 999px; background: #21262d; border: 1px solid #30363d; color: #8b949e; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    input, button { padding: 9px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.9rem; }
    input { flex: 1; min-width: 180px; }
    button { background: #238636; border-color: #2ea043; font-weight: 600; cursor: pointer; }
    button.primary { background: #1f6feb; border-color: #388bfd; }
    button.secondary { background: #21262d; border-color: #30363d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #revival-canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 10px; background: #090c10; border: 1px solid #30363d; touch-action: none; }
    pre { margin: 10px 0 0; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-size: 0.78rem; max-height: 120px; overflow: auto; color: #8b949e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>BlockBlox Revival (WebAssembly / PWA)</h1>
      <span id="wasmStatus" class="badge">Loading WASM engine…</span>
    </div>

    <div class="row">
      <button id="baseplateBtn" class="primary" disabled>Play Baseplate</button>
      <input id="placeFile" type="file" accept=".rbxl,.rbxlx" />
      <button id="offlineBtn" disabled>Play Local .rbxl / .rbxlx</button>
    </div>

    <div class="row">
      <input id="serverUrl" value="ws://raspberrypi.local:8080/ws" placeholder="ws://pi-zero-ip:8080/ws" />
      <button id="connectBtn" class="secondary">Test Server WS</button>
    </div>

    <canvas id="revival-canvas" width="960" height="540"></canvas>
    <pre id="log">Controls: WASD move · Space jump · Drag to orbit · 1–6 equip tools</pre>
  </div>

  <script type="module">
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('wasmStatus');
    const baseplateBtn = document.getElementById('baseplateBtn');
    const offlineBtn = document.getElementById('offlineBtn');
    const serverUrlEl = document.getElementById('serverUrl');

    if (location.host) {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      serverUrlEl.value = `${proto}//${location.host}/ws`;
    }
    const log = (m) => { logEl.textContent += `\n${m}`; logEl.scrollTop = logEl.scrollHeight; };

    let wasmMod = null;
    if (location.protocol === 'file:') {
      statusEl.textContent = 'Serve over HTTP (file:// blocked by browser)';
      statusEl.style.color = '#d29922';
      log('Browsers block WebAssembly & ES module imports on file:// URLs.');
      log('Run a local web server in this folder, then open http://localhost:8000 :');
      log('  python3 -m http.server 8000');
      log('  (or: npx serve .)');
    } else {
      try {
        const mod = await import('./pkg/revival_client.js');
        await mod.default();
        wasmMod = mod;
        statusEl.textContent = 'WASM Engine Ready (WebGL2/WebGPU)';
        statusEl.style.color = '#3fb950';
        baseplateBtn.disabled = false;
        offlineBtn.disabled = false;
        log('Loaded Rust revival-client WASM module.');
      } catch (err) {
        statusEl.textContent = 'WASM load error (see log below)';
        statusEl.style.color = '#f85149';
        log(`Failed to load ./pkg/revival_client.js: ${err.message}`);
      }
    }

    let launched = false;
    const ensureSingleLaunch = () => {
      if (launched) {
        log('Reload the page to switch places.');
        return false;
      }
      launched = true;
      baseplateBtn.disabled = true;
      offlineBtn.disabled = true;
      return true;
    };

    baseplateBtn.onclick = () => {
      if (!wasmMod || !ensureSingleLaunch()) return;
      log('Starting offline Baseplate in Rust WASM engine…');
      try {
        wasmMod.start_baseplate();
      } catch (e) {
        log(`Engine error: ${e}`);
      }
    };

    offlineBtn.onclick = async () => {
      if (!wasmMod) return;
      const file = document.getElementById('placeFile').files[0];
      if (!file) return log('Select a .rbxl or .rbxlx file first.');
      if (!ensureSingleLaunch()) return;
      const buf = new Uint8Array(await file.arrayBuffer());
      log(`Loading "${file.name}" (${buf.byteLength} bytes) into Rust WASM engine…`);
      try {
        wasmMod.start_place_bytes(buf);
      } catch (e) {
        log(`Failed to load place: ${e}`);
      }
    };

    document.getElementById('connectBtn').onclick = () => {
      const url = serverUrlEl.value.trim();
      log(`Connecting to ${url}…`);
      const ws = new WebSocket(url);
      ws.onopen = () => {
        log('Connected! Sending join…');
        ws.send(JSON.stringify({ type: 'join', username: 'WebPlayer' }));
      };
      ws.onmessage = (e) => log(`Server: ${e.data.slice(0, 200)}`);
      ws.onerror = () => log('WebSocket error (check server IP/port).');
      ws.onclose = () => log('Disconnected.');
    };
  </script>
</body>
</html>
